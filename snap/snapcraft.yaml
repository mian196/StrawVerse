name: strawverse
version: '6.0.4'
title: StrawVerse
summary: Download anime in batches & its fast :3
description: |
  StrawVerse is a Node.js-based anime & manga downloader that allows you to download anime episodes in bulk, quickly, and from multiple sources. It has functionality to automatically add the downloaded anime to your MyAnimeList plan-to-watch list.
license: ISC
icon: src/assets/luffy.png
contact: https://github.com/TheYogMehta/StrawVerse/issues
donation: https://buymeacoffee.com/kowareta
issues: https://github.com/TheYogMehta/StrawVerse/issues
source-code: https://github.com/TheYogMehta/StrawVerse
website: https://github.com/TheYogMehta/StrawVerse

base: core22
confinement: strict
grade: stable
compression: lzo

apps:
  strawverse:
    command: strawverse/strawverse --no-sandbox
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - unity7
      - browser-support
      - network
      - network-bind
      - gsettings
      - opengl
      - audio-playback
      - pulseaudio
      - home
      - removable-media

parts:
  strawverse:
    plugin: nil
    source: src/dist/linux-unpacked
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/strawverse
      cp -r * $SNAPCRAFT_PART_INSTALL/strawverse/
